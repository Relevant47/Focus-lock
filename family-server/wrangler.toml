name = "focuslock-family"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# D1 database for accounts, devices, lock_rules, pairing_codes, audit_log.
# After `npm run db:create`, paste the printed database_id in here.
[[d1_databases]]
binding       = "DB"
database_name = "focuslock-family"
database_id   = "44257886-0994-4140-902d-ce95d8d88f7c"

# Durable Object: one instance per device, holds the live WebSocket and
# the throttled last_seen tracker.
[[durable_objects.bindings]]
name       = "DEVICE_CONN"
class_name = "DeviceConnection"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceConnection"]

# JWT_SECRET is set via `npm run secret:set-jwt` — DO NOT commit it to source.
# For local dev (wrangler dev), put it in .dev.vars (gitignored).

# Phase 3.1 — Family Inbox weekly digest.
# Mondays at 14:00 UTC (mid-morning US Pacific, mid-afternoon UK, evening EU).
[triggers]
crons = ["0 14 * * 1"]
